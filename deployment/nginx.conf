# ============================================================================
#  概率论伴学助手 · Nginx 反向代理（原型模板）
# ----------------------------------------------------------------------------
#  ⚠️ 把 your-domain.example.edu 换成你的真实域名，证书路径按实际调整。
#
#  ★★★ 最容易踩的坑 ★★★
#  SSE（服务端推送）端点**必须**单独关掉缓冲：
#      proxy_buffering off;
#  不关的话，前端看不到"逐字输出"的效果 —— 回答会憋到全部生成完才一次性出现。
#  代码里已经加了 X-Accel-Buffering: no 响应头，但 Nginx 这里也要显式配，两个都要有。
# ============================================================================

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name your-domain.example.edu;

    # certbot 的验证路径要放行
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.example.edu;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # 上传体积（当前原型没有文件上传，留着以防后续加）
    client_max_body_size 4m;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ------------------------------------------------------------------
    # ★ SSE：对话流式端点
    # ------------------------------------------------------------------
    location = /api/chat/stream {
        proxy_pass http://app:8000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # ★ SSE：HITL 断点恢复端点（同样是流式）
    # ------------------------------------------------------------------
    location ~ ^/api/hitl/.*/resolve$ {
        proxy_pass http://app:8000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # 其余请求（静态资源 + 普通 API）
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # vendor 里的 KaTeX 字体很少变，缓存一下
        location ~* ^/vendor/.*\.(woff2?|ttf|css|js)$ {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # 油猴脚本必须以 UTF-8 返回，否则中文注释变乱码
    location ~ ^/widget/.*\.(js|user\.js)$ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        default_type application/javascript;
        charset utf-8;
    }
}
